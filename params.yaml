# Parâmetros do pipeline DVC.
# Alterar qualquer valor aqui invalida o cache do estágio correspondente.

# Seed global para split, validação cruzada e treinamento.
seed: 42

preprocess:
  # Proporção do dataset reservada exclusivamente para teste.
  test_size: 0.2

train:
  experiment_name: purchase-propensity
  registered_model_name: PurchasePropensityClassifier
  register_champion: true
  selection_metric: cv_f1_mean
  cv_folds: 5

  # Cada candidato gera uma run independente no MLflow.
  candidates:
    - name: logistic-regression-baseline
      estimator: logistic_regression
      params:
        max_iter: 1000
        C: 1.0
        class_weight: balanced

    - name: random-forest-balanced
      estimator: random_forest
      params:
        n_estimators: 300
        max_depth: 10
        min_samples_leaf: 2
        class_weight: balanced

    - name: random-forest-deep
      estimator: random_forest
      params:
        n_estimators: 400
        max_depth: 16
        min_samples_leaf: 1
        class_weight: balanced_subsample
